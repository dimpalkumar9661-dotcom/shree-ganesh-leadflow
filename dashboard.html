<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeadFlow Dashboard</title><style>body{font:16px system-ui;background:#eef3fa;color:#102346;margin:0}header{background:#102346;color:white;padding:22px 5%}main{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:white;padding:22px;border-radius:14px;margin:15px 0;box-shadow:0 2px 12px #10234610}input,button,select{padding:11px;border:1px solid #bcc9da;border-radius:7px;font:inherit}button{background:#2456a6;color:white;cursor:pointer;border:0}input{max-width:100%;box-sizing:border-box}#key{width:360px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats div{background:#e9f1ff;padding:16px;border-radius:10px;min-width:130px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd;vertical-align:top}td{overflow-wrap:anywhere}small{color:#52637d}.scroll{overflow-x:auto}.error{color:#a22020}#search{width:100%}</style><header><h2>Shree Ganesh AI Solutions — LeadFlow</h2><small style="color:#e4ecff">Private local lead management dashboard</small></header><main><section class="panel"><label for="key">Admin token (kept only in this tab's memory)</label><p><input type="password" id="key" autocomplete="off" placeholder="Enter ADMIN_TOKEN"> <button id="load">Load leads</button></p><small>Set ADMIN_TOKEN in PowerShell before starting app.py. Never share it.</small><p id="message" role="status"></p></section><section class="panel"><div class="stats" id="stats"></div><p><input id="search" placeholder="Search leads by name, company, email, message" aria-label="Search leads"></p><div class="scroll"><table><thead><tr><th>Date</th><th>Customer</th><th>Contact</th><th>Company</th><th>Requirement</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="6">Load leads to begin.</td></tr></tbody></table></div></section></main><script>
let token='',leads=[];const $=id=>document.getElementById(id);function el(tag,value){const n=document.createElement(tag);n.textContent=value??'';return n}function show(){const q=$('search').value.toLowerCase();$('stats').replaceChildren(...[['Total',leads.length],['New',leads.filter(x=>x.status==='new').length],['Contacted',leads.filter(x=>x.status==='contacted').length],['Converted',leads.filter(x=>x.status==='converted').length]].map(([label,num])=>{let d=el('div');d.append(el('small',label),el('h2',num));return d}));$('rows').replaceChildren();let filtered=leads.filter(x=>[x.name,x.email,x.phone,x.company,x.message].join(' ').toLowerCase().includes(q));if(!filtered.length){let r=el('tr'),c=el('td','No matching leads');c.colSpan=6;r.append(c);$('rows').append(r)}for(const x of filtered){let r=el('tr');for(const v of [x.created_at?.slice(0,10),x.name,x.email+' / '+(x.phone||''),x.company,x.message])r.append(el('td',v));let td=el('td'),s=el('select');for(const value of ['new','contacted','converted','lost']){let opt=el('option',value[0].toUpperCase()+value.slice(1));opt.value=value;s.append(opt)}s.value=x.status;s.addEventListener('change',async()=>{s.disabled=true;try{const response=await fetch('/api/leads/'+x.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({status:s.value})});if(!response.ok)throw Error('Update failed: '+response.status);x.status=s.value;$('message').textContent='Status updated';show()}catch(e){s.value=x.status;$('message').textContent=e.message}finally{s.disabled=false}});td.append(s);r.append(td);$('rows').append(r)}}$('load').addEventListener('click',async()=>{token=$('key').value;$('message').textContent='Loading…';try{const response=await fetch('/api/leads',{headers:{'X-Admin-Token':token}});if(!response.ok)throw Error('Access denied or server error ('+response.status+'). Check your token.');leads=(await response.json()).leads;$('message').textContent='Loaded '+leads.length+' leads';show()}catch(e){$('message').textContent=e.message;$('message').className='error'}});$('search').addEventListener('input',show);
</script></html>
